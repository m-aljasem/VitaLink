<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>VitaLink</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="theme-color" content="#146C68" />
  
  <!-- Apply the saved theme before first paint to avoid a light flash (ThemeService takes over after bootstrap) -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('vitalink-theme') || 'light';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('ion-palette-dark');
      } catch (e) {}
    })();
  </script>

  <!-- Capture beforeinstallprompt event early, before Angular bootstraps -->
  <script>
    // Store the deferred prompt event globally so Angular service can access it
    window.addEventListener('beforeinstallprompt', function(e) {
      // Prevent the default browser install prompt
      e.preventDefault();
      // Store the event globally
      window.__deferredPrompt = e;
    });
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
